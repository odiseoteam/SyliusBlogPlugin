sylius_grid:
    grids:
        odiseo_blog_admin_author:
            driver:
                name: doctrine/orm
                options:
                    class: "%odiseo_blog.model.author.class%"
            sorting:
                name: asc
            fields:
                avatar:
                    type: twig
                    label: sylius.ui.avatar
                    path: .
                    options:
                        template: "@OdiseoSyliusBlogPlugin/admin/author/grid/field/avatar.html.twig"
                        vars:
                            th_class: "w-1"
                name:
                    type: twig
                    label: sylius.ui.name
                    sortable: ~
                    options:
                        template: "@SyliusAdmin/shared/grid/field/name.html.twig"
                code:
                    type: twig
                    label: sylius.ui.code
                    sortable: ~
                    options:
                        template: "@SyliusAdmin/shared/grid/field/code.html.twig"
                adminUser:
                    type: twig
                    label: odiseo_blog.ui.admin_user
                    path: .
                    options:
                        template: "@OdiseoSyliusBlogPlugin/admin/author/grid/field/admin_user.html.twig"
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    sortable: ~
                    options:
                        template: "@SyliusAdmin/shared/grid/field/boolean.html.twig"
                        vars:
                            th_class: "w-1 text-center"
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [code, name]
                enabled:
                    type: boolean
                    label: sylius.ui.enabled
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
