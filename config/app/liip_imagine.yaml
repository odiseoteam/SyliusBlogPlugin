# "fixed" always returns the exact size, so templates can rely on the dimensions. Unlike "thumbnail",
# it also enlarges small images.
liip_imagine:
    filter_sets:
        odiseo_blog_admin_thumbnail:
            format: webp
            quality: 80
            filters:
                fixed: { width: 200, height: 200 }
        odiseo_blog_avatar:
            format: webp
            quality: 80
            filters:
                fixed: { width: 240, height: 240 }
        odiseo_blog_card:
            format: webp
            quality: 80
            filters:
                fixed: { width: 800, height: 450 }
        odiseo_blog_hero:
            format: webp
            quality: 80
            filters:
                fixed: { width: 1600, height: 900 }
        # Not every social network shows WebP previews.
        odiseo_blog_og:
            format: jpg
            quality: 80
            filters:
                fixed: { width: 1200, height: 630 }
        # The images of the content shrink to these widths and keep their proportions; they are never enlarged.
        odiseo_blog_content_640:
            format: webp
            quality: 80
            filters:
                downscale: { max: [640, 10000] }
        odiseo_blog_content_960:
            format: webp
            quality: 80
            filters:
                downscale: { max: [960, 10000] }
        odiseo_blog_content_1280:
            format: webp
            quality: 80
            filters:
                downscale: { max: [1280, 10000] }
        odiseo_blog_content_1920:
            format: webp
            quality: 80
            filters:
                downscale: { max: [1920, 10000] }
        odiseo_blog_gallery:
            format: webp
            quality: 80
            filters:
                fixed: { width: 600, height: 600 }
