sylius_resource:
    resources:
        odiseo_blog.article:
            driver: doctrine/orm
            classes:
                model: Odiseo\SyliusBlogPlugin\Entity\Article
                interface: Odiseo\SyliusBlogPlugin\Entity\ArticleInterface
                repository: Odiseo\SyliusBlogPlugin\Repository\ArticleRepository
                factory: Sylius\Resource\Factory\TranslatableFactory
                form: Odiseo\SyliusBlogPlugin\Form\Type\ArticleType
            translation:
                classes:
                    model: Odiseo\SyliusBlogPlugin\Entity\ArticleTranslation
                    interface: Odiseo\SyliusBlogPlugin\Entity\ArticleTranslationInterface
                    form: Odiseo\SyliusBlogPlugin\Form\Type\ArticleTranslationType

        odiseo_blog.article_author:
            driver: doctrine/orm
            classes:
                model: Odiseo\SyliusBlogPlugin\Entity\ArticleAuthor
                interface: Odiseo\SyliusBlogPlugin\Entity\ArticleAuthorInterface

        odiseo_blog.article_image:
            driver: doctrine/orm
            classes:
                model: Odiseo\SyliusBlogPlugin\Entity\ArticleImage
                interface: Odiseo\SyliusBlogPlugin\Entity\ArticleImageInterface
