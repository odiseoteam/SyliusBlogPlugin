sylius_twig_hooks:
    hooks:
        'odiseo_blog.admin.author.create.content':
            form:
                component: 'odiseo_blog_admin:author:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@SyliusAdmin/shared/crud/common/content/form.html.twig'
                configuration:
                    render_rest: false
                priority: 100

        'odiseo_blog.admin.author.create.content.form':
            # Same name as the Sylius common form hookable, so it replaces it.
            sections:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/two_columns.html.twig'
                priority: 0

        'odiseo_blog.admin.author.create.content.form.sections#left':
            general:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/general.html.twig'
                priority: 100
            translations:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations.html.twig'
                priority: 0

        'odiseo_blog.admin.author.create.content.form.sections#right':
            image:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/image.html.twig'
                configuration:
                    remove_route: odiseo_blog_admin_author_remove_image
                priority: 100
            social_links:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/social_links.html.twig'
                priority: 0

        'odiseo_blog.admin.author.create.content.form.sections.general':
            default:
                enabled: false
            code:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/general/code.html.twig'
                priority: 400
            name:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/general/name.html.twig'
                priority: 300
            slug:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/general/slug.html.twig'
                priority: 200
            enabled:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/general/enabled.html.twig'
                priority: 100
            admin_user:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/general/admin_user.html.twig'
                priority: 0

        'odiseo_blog.admin.author.create.content.form.sections.translations':
            job_title:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/translations/job_title.html.twig'
                priority: 400
            bio:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/translations/bio.html.twig'
                priority: 300
            meta_title:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/meta_title.html.twig'
                priority: 200
            meta_description:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/meta_description.html.twig'
                priority: 100

        'odiseo_blog.admin.author.update.content':
            form:
                component: 'odiseo_blog_admin:author:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@SyliusAdmin/shared/crud/common/content/form.html.twig'
                configuration:
                    render_rest: false
                priority: 100

        'odiseo_blog.admin.author.update.content.header':
            breadcrumbs:
                template: '@SyliusAdmin/shared/crud/update/content/header/breadcrumbs.html.twig'
                configuration:
                    rendered_field: name
                priority: 100

        'odiseo_blog.admin.author.update.content.form':
            # Same name as the Sylius common form hookable, so it replaces it.
            sections:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/two_columns.html.twig'
                priority: 0

        'odiseo_blog.admin.author.update.content.form.sections#left':
            general:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/general.html.twig'
                priority: 100
            translations:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations.html.twig'
                priority: 0

        'odiseo_blog.admin.author.update.content.form.sections#right':
            image:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/image.html.twig'
                configuration:
                    remove_route: odiseo_blog_admin_author_remove_image
                priority: 100
            social_links:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/social_links.html.twig'
                priority: 0

        'odiseo_blog.admin.author.update.content.form.sections.general':
            default:
                enabled: false
            code:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/general/code.html.twig'
                priority: 400
            name:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/general/name.html.twig'
                priority: 300
            slug:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/general/slug.html.twig'
                priority: 200
            enabled:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/general/enabled.html.twig'
                priority: 100
            admin_user:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/general/admin_user.html.twig'
                priority: 0

        'odiseo_blog.admin.author.update.content.form.sections.translations':
            job_title:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/translations/job_title.html.twig'
                priority: 400
            bio:
                template: '@OdiseoSyliusBlogPlugin/admin/author/form/sections/translations/bio.html.twig'
                priority: 300
            meta_title:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/meta_title.html.twig'
                priority: 200
            meta_description:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/meta_description.html.twig'
                priority: 100
