sylius_twig_hooks:
    hooks:
        'odiseo_blog.admin.article_tag.create.content':
            form:
                component: 'odiseo_blog_admin:article_tag:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@SyliusAdmin/shared/crud/common/content/form.html.twig'
                configuration:
                    render_rest: false
                priority: 100

        'odiseo_blog.admin.article_tag.create.content.form.sections':
            general:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/general.html.twig'
                priority: 100
            translations:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations.html.twig'
                priority: 0

        'odiseo_blog.admin.article_tag.create.content.form.sections.general':
            default:
                enabled: false
            code:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/general/code.html.twig'
                priority: 0

        'odiseo_blog.admin.article_tag.create.content.form.sections.translations':
            name:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/name.html.twig'
                priority: 300
            slug:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/slug.html.twig'
                priority: 200
            meta_title:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/meta_title.html.twig'
                priority: 100
            meta_description:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/meta_description.html.twig'
                priority: 0

        'odiseo_blog.admin.article_tag.update.content':
            form:
                component: 'odiseo_blog_admin:article_tag:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@SyliusAdmin/shared/crud/common/content/form.html.twig'
                configuration:
                    render_rest: false
                priority: 100

        'odiseo_blog.admin.article_tag.update.content.header':
            breadcrumbs:
                template: '@SyliusAdmin/shared/crud/update/content/header/breadcrumbs.html.twig'
                configuration:
                    rendered_field: name
                priority: 100

        'odiseo_blog.admin.article_tag.update.content.form.sections':
            general:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/general.html.twig'
                priority: 100
            translations:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations.html.twig'
                priority: 0

        'odiseo_blog.admin.article_tag.update.content.form.sections.general':
            default:
                enabled: false
            code:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/general/code.html.twig'
                priority: 0

        'odiseo_blog.admin.article_tag.update.content.form.sections.translations':
            name:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/name.html.twig'
                priority: 300
            slug:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/slug.html.twig'
                priority: 200
            meta_title:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/meta_title.html.twig'
                priority: 100
            meta_description:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations/meta_description.html.twig'
                priority: 0
