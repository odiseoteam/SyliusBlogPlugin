sylius_twig_hooks:
    hooks:
        'odiseo_blog.admin.channel_configuration.update.content':
            form:
                template: '@SyliusAdmin/shared/crud/common/content/form.html.twig'
                configuration:
                    # New configurations have no id yet, but the route only takes PUT.
                    method: 'PUT'
                    render_rest: false
                priority: 100

        'odiseo_blog.admin.channel_configuration.update.content.header':
            breadcrumbs:
                template: '@SyliusAdmin/shared/crud/update/content/header/breadcrumbs.html.twig'
                configuration:
                    rendered_field: channel
                priority: 100

        'odiseo_blog.admin.channel_configuration.update.content.form.sections':
            general:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/general.html.twig'
                priority: 100
            translations:
                template: '@OdiseoSyliusBlogPlugin/admin/shared/form/sections/translations.html.twig'
                priority: 0

        'odiseo_blog.admin.channel_configuration.update.content.form.sections.general':
            default:
                enabled: false
            enabled:
                template: '@OdiseoSyliusBlogPlugin/admin/channel_configuration/form/sections/general/enabled.html.twig'
                priority: 100
            posts_per_page:
                template: '@OdiseoSyliusBlogPlugin/admin/channel_configuration/form/sections/general/posts_per_page.html.twig'
                priority: 0

        'odiseo_blog.admin.channel_configuration.update.content.form.sections.translations':
            title:
                template: '@OdiseoSyliusBlogPlugin/admin/channel_configuration/form/sections/translations/title.html.twig'
                priority: 100
            description:
                template: '@OdiseoSyliusBlogPlugin/admin/channel_configuration/form/sections/translations/description.html.twig'
                priority: 0
