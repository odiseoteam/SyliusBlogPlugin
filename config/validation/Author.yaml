Odiseo\SyliusBlogPlugin\Entity\Author:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
            fields: [code]
            message: 'odiseo_blog.code.unique'
            groups: ['odiseo_blog']
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
            fields: [slug]
            message: 'odiseo_blog.slug.unique'
            groups: ['odiseo_blog']
    properties:
        code:
            - NotBlank:
                groups: ['odiseo_blog']
            - Length:
                max: 255
                groups: ['odiseo_blog']
            - Regex:
                pattern: '/^[\w-]*$/'
                message: 'odiseo_blog.code.regex'
                groups: ['odiseo_blog']
        name:
            - NotBlank:
                groups: ['odiseo_blog']
            - Length:
                max: 255
                groups: ['odiseo_blog']
        slug:
            - NotBlank:
                groups: ['odiseo_blog']
            - Length:
                max: 255
                groups: ['odiseo_blog']
        translations:
            - Valid: ~
        image:
            - Valid: ~
