services:
    odiseo_blog.form.type.author:
        class: Odiseo\SyliusBlogPlugin\Form\Type\AuthorType
        arguments:
            - '%odiseo_blog.model.author.class%'
            - ['odiseo_blog']
        tags: ['form.type']

    odiseo_blog.form.type.author_translation:
        class: Odiseo\SyliusBlogPlugin\Form\Type\AuthorTranslationType
        arguments:
            - '%odiseo_blog.model.author_translation.class%'
            - ['odiseo_blog']
        tags: ['form.type']

    odiseo_blog.form.type.author_image:
        class: Odiseo\SyliusBlogPlugin\Form\Type\AuthorImageType
        arguments:
            - '%odiseo_blog.model.author_image.class%'
            - ['odiseo_blog']
        tags: ['form.type']

    odiseo_blog.form.type.author_social_link:
        class: Odiseo\SyliusBlogPlugin\Form\Type\AuthorSocialLinkType
        arguments: ['%odiseo_blog.social_networks%']
        tags: ['form.type']

    odiseo_blog.form.type.admin_user_autocomplete:
        class: Odiseo\SyliusBlogPlugin\Form\Type\AdminUserAutocompleteType
        arguments:
            - '%sylius.model.admin_user.class%'
            - '%odiseo_blog.model.author.class%'
        tags: ['form.type', 'ux.entity_autocomplete_field']

    odiseo_blog.twig.component.admin.author.form:
        class: Odiseo\SyliusBlogPlugin\Twig\Component\Admin\AuthorFormComponent
        arguments:
            - '@odiseo_blog.repository.author'
            - '@form.factory'
            - '%odiseo_blog.model.author.class%'
            - Odiseo\SyliusBlogPlugin\Form\Type\AuthorType
            - '@sylius.generator.slug'
        tags:
            - { name: sylius.live_component.admin, key: 'odiseo_blog_admin:author:form' }

    odiseo_blog.controller.admin.remove_author_image:
        class: Odiseo\SyliusBlogPlugin\Controller\Admin\RemoveImageAction
        public: true
        arguments:
            - '@odiseo_blog.repository.author'
            - '@odiseo_blog.manager.author'
            - '@router'
            - '@?security.csrf.token_manager'
            - odiseo_blog_admin_author_update
