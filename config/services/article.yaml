services:
    odiseo_blog.form.type.article:
        class: Odiseo\SyliusBlogPlugin\Form\Type\ArticleType
        arguments:
            - '%odiseo_blog.model.article.class%'
            - ['odiseo_blog']
            - '@sylius.repository.channel'
        tags: ['form.type']

    odiseo_blog.form.type.article_translation:
        class: Odiseo\SyliusBlogPlugin\Form\Type\ArticleTranslationType
        arguments:
            - '%odiseo_blog.model.article_translation.class%'
            - ['odiseo_blog']
        tags: ['form.type']

    odiseo_blog.form.type.article_tag_autocomplete:
        class: Odiseo\SyliusBlogPlugin\Form\Type\ArticleTagAutocompleteType
        arguments: ['%odiseo_blog.model.article_tag.class%']
        tags: ['form.type', 'ux.entity_autocomplete_field']

    odiseo_blog.twig.component.admin.article.form:
        class: Odiseo\SyliusBlogPlugin\Twig\Component\Admin\TranslatableSlugFormComponent
        arguments:
            - '@odiseo_blog.repository.article'
            - '@form.factory'
            - '%odiseo_blog.model.article.class%'
            - Odiseo\SyliusBlogPlugin\Form\Type\ArticleType
            - '@sylius.generator.slug'
            - title
        tags:
            - { name: sylius.live_component.admin, key: 'odiseo_blog_admin:article:form' }
