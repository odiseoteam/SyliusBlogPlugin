version: 2
updates:
    - package-ecosystem: composer
      directory: "/"
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      ignore:
          # The plugin supports Symfony 6.4 and 7.4.
          - dependency-name: "symfony/*"
            versions: [">=8.0"]
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: monthly
