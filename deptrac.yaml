# Code for upgrading from 1.x stays isolated so it can be deleted in one go,
# and the content pipeline knows nothing about the blog so it can be reused.
deptrac:
    paths:
        - ./src

    layers:
        - name: Legacy
          collectors:
              - type: directory
                value: src/Legacy/.*

        - name: Content
          collectors:
              - type: directory
                value: src/Content/.*

        - name: Plugin
          collectors:
              - type: bool
                must:
                    - type: directory
                      value: src/.*
                must_not:
                    - type: directory
                      value: src/Legacy/.*
                    - type: directory
                      value: src/Content/.*

    ruleset:
        # Nothing may depend on Legacy, and Content depends on nothing of the blog.
        Content: ~
        Plugin:
            - Content
        Legacy:
            - Plugin
            - Content
